<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbitando Infra Endpoints</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --panel: #fffdf8;
      --ink: #1f2937;
      --muted: #6b7280;
      --accent: #0f766e;
      --accent-dark: #115e59;
      --border: #d6d3d1;
      --shadow: 0 18px 40px rgba(31, 41, 55, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(15, 118, 110, 0.12), transparent 32%),
        linear-gradient(180deg, #f8f5ef 0%, var(--bg) 100%);
    }

    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 48px 20px 64px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1;
    }

    .subtitle {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 56ch;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 1.25rem;
    }

    .card p {
      margin: 0 0 18px;
      color: var(--muted);
      word-break: break-word;
    }

    .button {
      display: inline-block;
      width: 100%;
      padding: 12px 16px;
      border-radius: 999px;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
      box-shadow: 0 10px 24px rgba(15, 118, 110, 0.22);
    }

    code {
      font-family: Consolas, monospace;
    }
  </style>
</head>
<body>
  <main>
    <h1>Orbitando Infra</h1>
    <p class="subtitle">Accesos directos a los servicios publicados en la instancia actual.</p>

    <section class="grid">
      <article class="card">
        <h2>Dagu</h2>
        <p><code>http://54.246.4.182:3013</code></p>
        <a class="button" href="http://54.246.4.182:3013" target="_blank" rel="noreferrer">Abrir Dagu</a>
      </article>

      <article class="card">
        <h2>Selenium (noVNC)</h2>
        <p><code>http://54.246.4.182:7900</code></p>
        <a class="button" href="http://54.246.4.182:7900" target="_blank" rel="noreferrer">Abrir noVNC</a>
      </article>

      <article class="card">
        <h2>Refinement Portal</h2>
        <p><code>http://54.246.4.182:5002</code></p>
        <a class="button" href="http://54.246.4.182:5002" target="_blank" rel="noreferrer">Abrir Portal</a>
      </article>

      <article class="card">
        <h2>Frontend</h2>
        <p><code>http://54.246.4.182:5000</code></p>
        <a class="button" href="http://54.246.4.182:5000" target="_blank" rel="noreferrer">Abrir Frontend</a>
      </article>
    </section>
  </main>
</body>
</html>
