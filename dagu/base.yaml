# Base DAG configuration for this stack.
# We keep Dagu's operational defaults but intentionally omit `retry_policy`
# so DAGs do not retry automatically after a failure.

overlap_policy: skip
log_output: separate
hist_retention_days: 30
max_clean_up_time_sec: 5
max_active_steps: 10
max_output_size: 1048576
catchup_window: "6h"
