name: "TestFrontendBuild"
params:
  - TARGET_CITY: "almeria"
  - BASE_URL: ""
  - OUT_DIR: "dist"
  - NO_DOWNLOAD_IMAGES: "0"

env:
  TARGET_CITY: ${TARGET_CITY}
  BASE_URL: ${BASE_URL}
  OUT_DIR: ${OUT_DIR}
  NO_DOWNLOAD_IMAGES: ${NO_DOWNLOAD_IMAGES}

steps:
  - name: "build_frontend"
    command: >
      env HOME=/tmp bash -lc 'set -eu;
      IMAGE="infra_scripts-test_frontend_build:latest";
      if ! docker image inspect "$IMAGE" >/dev/null 2>&1; then
        echo "Missing image: $IMAGE";
        echo "Build it first with: docker compose --profile build build test_frontend_build";
        exit 1;
      fi;
      EXTRA_ARGS="";
      if [ "${NO_DOWNLOAD_IMAGES}" = "1" ]; then
        EXTRA_ARGS="--no-download-images";
      fi;
      docker run --rm
      -e ORBITA_CITY="$TARGET_CITY"
      -v /home/ubuntu/work/frontend_build/test_frontend:/app
      -v infra_scripts_test_frontend_node_modules:/app/node_modules
      -v /home/ubuntu/work/frontend_build/test_frontend/dist:/app/dist
      -v /home/ubuntu/data_storage:/home/ubuntu/data_storage
      "$IMAGE"
      --city "$TARGET_CITY"
      --out "$OUT_DIR"
      --base-url "$BASE_URL"
      $EXTRA_ARGS'
