name: "FisgonTask"
params:
  - TARGET_CITY: ""
  - TARGET_SCRAPER: ""

steps:
  - name: "tarea_1"
    command: >
      docker run --rm
      --network host
      -v /home/ubuntu/work/fisgon:/app
      -v /home/ubuntu/data_storage:/home/ubuntu/data_storage
      -w /app
      -e OPERATION=0
      -e DOCKER_CONFIG=/tmp/.docker
      -e HOME=/tmp
      -e TARGET_CITY
      -e TARGET_SCRAPER
      -e DAG_RUN_URL="${DAGU_BASE_URL}/dags/${DAG_NAME}?dagRunId=${DAG_RUN_ID}"
      fisgon_scraper:1.0

  - name: "restart_selenium"
    command: "env DOCKER_CONFIG=/tmp/.docker HOME=/tmp docker restart selenium"
    depends: ["tarea_1"]



