name: "FrontendBuild"
params:
  - TARGET_CITY: "Almeria"
  - BASE_URL: "https://orbitatest.b-cdn.net/"
  - OUT_DIR: "dist"
  - NO_DOWNLOAD_IMAGES: "1"
  - BUNNY_STORAGE_ZONE: "orbitastorage"
  - BUNNY_STORAGE_API_KEY: ""

env:
  TARGET_CITY: ${TARGET_CITY}
  BASE_URL: ${BASE_URL}
  OUT_DIR: ${OUT_DIR}
  NO_DOWNLOAD_IMAGES: ${NO_DOWNLOAD_IMAGES}
  BUNNY_STORAGE_ZONE: ${BUNNY_STORAGE_ZONE}
  BUNNY_STORAGE_API_KEY: ${BUNNY_STORAGE_API_KEY}

steps:

  - name: "snapshot_master_events"
    command: >
      env HOME=/tmp bash -lc 'set -eu;
      CITY_SLUG="$(printf "%s" "$TARGET_CITY" | tr "[:upper:]" "[:lower:]")";
      docker run --rm
      -v /home/ubuntu/data_storage:/src_data:ro
      -v /home/ubuntu/work/frontend_build/test_frontend:/repo
      alpine:3.20
      sh -lc "
      set -eu;
      SRC_DIR=\"\";
      for d in /src_data/*; do
        [ -d \"\$d\" ] || continue;
        if [ \"\$(basename \"\$d\" | tr \"[:upper:]\" \"[:lower:]\")\" = \"$CITY_SLUG\" ]; then
          SRC_DIR=\"\$d\";
          break;
        fi;
      done;
      if [ -z \"\$SRC_DIR\" ]; then
        echo \"City data folder not found in /home/ubuntu/data_storage for $TARGET_CITY\";
        exit 1;
      fi;
      SRC_FILE=\"\$SRC_DIR/00_master/master_events.json\";
      DEST_FILE=\"/repo/data/$CITY_SLUG/master_events.json\";
      [ -f \"\$SRC_FILE\" ] || { echo \"Missing source file: \$SRC_FILE\"; exit 1; };
      mkdir -p \"\$(dirname \"\$DEST_FILE\")\";
      cp \"\$SRC_FILE\" \"\$DEST_FILE\";
      echo \"Snapshot copied to \$DEST_FILE\"
      "'

  - name: "commit_and_push_snapshot"
    command: >
      env HOME=/tmp bash -lc 'set -eu;
      CITY_SLUG="$(printf "%s" "$TARGET_CITY" | tr "[:upper:]" "[:lower:]")";
      SNAPSHOT_PATH="data/$CITY_SLUG/master_events.json";
      docker run --rm
      --entrypoint sh
      -v /home/ubuntu/work/frontend_build/test_frontend:/repo
      -v /home/ubuntu/.ssh:/root/.ssh:ro
      -w /repo
      alpine/git:latest
      -lc "
      set -eu;
      git config --global --add safe.directory /repo;
      git add \"$SNAPSHOT_PATH\";
      if git diff --cached --quiet -- \"$SNAPSHOT_PATH\"; then
        echo \"No snapshot changes to commit for $SNAPSHOT_PATH\";
        exit 0;
      fi;
      BRANCH=\$(git rev-parse --abbrev-ref HEAD);
      COMMIT_MSG=\"chore(snapshot): update master_events for $CITY_SLUG \$(date -u +%Y-%m-%dT%H:%M:%SZ)\";
      git -c user.name=\"Dagu Snapshot Bot\" -c user.email=\"dagu-snapshot@example.com\" commit -m \"\$COMMIT_MSG\" -- \"$SNAPSHOT_PATH\";
      git push origin \"\$BRANCH\"
      "'

  - name: "build_frontend"
    command: >
      env HOME=/tmp bash -lc 'set -eu;
      IMAGE="infra_scripts-test_frontend_build:latest";
      if ! docker image inspect "$IMAGE" >/dev/null 2>&1; then
        echo "Missing image: $IMAGE";
        echo "Build it first with: docker compose --profile build build test_frontend_build";
        exit 1;
      fi;
      EXTRA_ARGS="";
      if [ "${NO_DOWNLOAD_IMAGES}" = "1" ]; then
        EXTRA_ARGS="--no-download-images";
      fi;
      docker run --rm
      --entrypoint sh
      -e ORBITA_CITY="$TARGET_CITY"
      -v /home/ubuntu/work/frontend_build/test_frontend:/app
      -v infra_scripts_test_frontend_node_modules:/app/node_modules
      -v /home/ubuntu/work/frontend_build/test_frontend/dist:/app/dist
      -v /home/ubuntu/data_storage:/home/ubuntu/data_storage
      "$IMAGE"
      scripts/docker_static_entrypoint.sh
      --city "$TARGET_CITY"
      --out "$OUT_DIR"
      --base-url "$BASE_URL"
      $EXTRA_ARGS'

