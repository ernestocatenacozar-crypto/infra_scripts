env:
  TARGET_CITY: ${TARGET_CITY}
  SKIP_DOWNLOAD_IMAGES: ${SKIP_DOWNLOAD_IMAGES}
  BASE_URL: ${BASE_URL}
  BUNNY_STORAGE_ZONE: ${BUNNY_STORAGE_ZONE}
  BUNNY_STORAGE_API_KEY: ${BUNNY_STORAGE_API_KEY}
  BUNNY_PULL_ZONE_ID: ${BUNNY_PULL_ZONE_ID}
  BUNNY_ACCOUNT_API_KEY: ${BUNNY_ACCOUNT_API_KEY}
  HOST_DATA_STORAGE_PATH: ${HOST_DATA_STORAGE_PATH}
  HOST_FRONTEND_PATH: ${HOST_FRONTEND_PATH}
  HOST_FRONTEND_DIST_PATH: ${HOST_FRONTEND_DIST_PATH}
  HOST_SSH_PATH: ${HOST_SSH_PATH}
  FRONTEND_IMAGE: ${FRONTEND_IMAGE}
  FRONTEND_BUILD_IMAGE: ${FRONTEND_BUILD_IMAGE}
  FRONTEND_NODE_MODULES_VOLUME: ${FRONTEND_NODE_MODULES_VOLUME}

steps:
  - name: "snapshot_master_events"
    id: snapshot_master_events
    run: >
      env HOME=/tmp bash -lc 'set -eu;
      CITY_SLUG="$(printf "%s" "$TARGET_CITY" | tr "[:upper:]" "[:lower:]")";
      docker run --rm
      -v "$HOST_DATA_STORAGE_PATH:/src_data:ro"
      -v "$HOST_FRONTEND_PATH:/repo"
      alpine:3.20
      sh -lc "
      set -eu;
      SRC_DIR=\"\";
      for d in /src_data/*; do
        [ -d \"\$d\" ] || continue;
        if [ \"\$(basename \"\$d\" | tr \"[:upper:]\" \"[:lower:]\")\" = \"$CITY_SLUG\" ]; then
          SRC_DIR=\"\$d\";
          break;
        fi;
      done;
      if [ -z \"\$SRC_DIR\" ]; then
        echo \"City data folder not found in $HOST_DATA_STORAGE_PATH for $TARGET_CITY\";
        exit 1;
      fi;
      SRC_FILE=\"\$SRC_DIR/00_master/master_events.json\";
      DEST_FILE=\"/repo/data/$CITY_SLUG/master_events.json\";
      [ -f \"\$SRC_FILE\" ] || { echo \"Missing source file: \$SRC_FILE\"; exit 1; };
      mkdir -p \"\$(dirname \"\$DEST_FILE\")\";
      cp \"\$SRC_FILE\" \"\$DEST_FILE\";
      echo \"Snapshot copied to \$DEST_FILE\"
      "'

  - name: "commit_and_push_snapshot"
    id: commit_and_push_snapshot
    depends: [snapshot_master_events]
    run: >
      env HOME=/tmp bash -lc 'set -eu;
      CITY_SLUG="$(printf "%s" "$TARGET_CITY" | tr "[:upper:]" "[:lower:]")";
      SNAPSHOT_PATH="data/$CITY_SLUG/master_events.json";
      docker run --rm
      --entrypoint sh
      -v "$HOST_FRONTEND_PATH:/repo"
      -v "$HOST_SSH_PATH:/root/.ssh:ro"
      -w /repo
      alpine/git:latest
      -lc "
      set -eu;
      git config --global --add safe.directory /repo;
      git checkout main;
      git pull origin main;
      git add \"$SNAPSHOT_PATH\";
      if git diff --cached --quiet -- \"$SNAPSHOT_PATH\"; then
        echo \"No snapshot changes to commit for $SNAPSHOT_PATH\";
        exit 0;
      fi;
      COMMIT_MSG=\"chore(snapshot): update master_events for $CITY_SLUG \$(date -u +%Y-%m-%dT%H:%M:%SZ)\";
      git -c user.name=\"Dagu Snapshot Bot\" -c user.email=\"dagu-snapshot@example.com\" commit -m \"\$COMMIT_MSG\" -- \"$SNAPSHOT_PATH\";
      git push origin main
      "'

  - name: "build_frontend"
    id: build_frontend
    depends: [commit_and_push_snapshot]
    run: >
      env HOME=/tmp bash -lc 'set -eu;
      IMAGE="${FRONTEND_BUILD_IMAGE}";
      if ! docker image inspect "$IMAGE" >/dev/null 2>&1; then
        echo "Missing image: $IMAGE";
        echo "Build it first with: docker compose --profile build build frontend_build";
        exit 1;
      fi;
      EXTRA_ARGS="";
      if [ "${SKIP_DOWNLOAD_IMAGES}" = "1" ]; then
        EXTRA_ARGS="--no-download-images";
      fi;
      docker run --rm
      --entrypoint sh
      -e ORBITA_CITY="$TARGET_CITY"
      -e HOST_FRONTEND_PATH="$HOST_FRONTEND_PATH"
      -e HOST_DATA_STORAGE_PATH="$HOST_DATA_STORAGE_PATH"
      -v "$HOST_FRONTEND_PATH:/app"
      -v "$HOST_FRONTEND_PATH:$HOST_FRONTEND_PATH"
      -v "$FRONTEND_NODE_MODULES_VOLUME:/app/node_modules"
      -v "$HOST_FRONTEND_DIST_PATH:/app/dist"
      -v "$HOST_DATA_STORAGE_PATH:$HOST_DATA_STORAGE_PATH"
      "$IMAGE"
      scripts/docker_static_entrypoint.sh
      --city "$TARGET_CITY"
      --out "dist"
      --base-url "$BASE_URL"
      $EXTRA_ARGS'

  - name: "upload_to_bunny"
    id: upload_to_bunny
    depends: [build_frontend]
    run: >
      env HOME=/tmp bash -lc 'set -eu;
      CITY_SLUG="$(printf "%s" "$TARGET_CITY" | tr "[:upper:]" "[:lower:]")";
      docker run --rm --entrypoint sh
      -e BUNNY_STORAGE_ZONE="$BUNNY_STORAGE_ZONE"
      -e BUNNY_STORAGE_API_KEY="$BUNNY_STORAGE_API_KEY"
      -e CITY_SLUG="$CITY_SLUG"
      -v "$HOST_FRONTEND_DIST_PATH:/app/dist"
      "$FRONTEND_IMAGE"
      -c "set -eu; ROOT_UPLOAD_CMDS=\"\"; [ ! -f /app/dist/sitemap.xml ] || ROOT_UPLOAD_CMDS=\"\$ROOT_UPLOAD_CMDS put -O / /app/dist/sitemap.xml;\"; [ ! -f /app/dist/robots.txt ] || ROOT_UPLOAD_CMDS=\"\$ROOT_UPLOAD_CMDS put -O / /app/dist/robots.txt;\"; [ ! -f /app/dist/llms.txt ] || ROOT_UPLOAD_CMDS=\"\$ROOT_UPLOAD_CMDS put -O / /app/dist/llms.txt;\"; cd /app/dist/$CITY_SLUG; LFTP_CMDS=\"\$ROOT_UPLOAD_CMDS cd /; cd $CITY_SLUG; mirror -R --parallel=25 . .; cd /;\"; lftp -u \"$BUNNY_STORAGE_ZONE,$BUNNY_STORAGE_API_KEY\" storage.bunnycdn.com -e \"\$LFTP_CMDS bye\""'

  - name: "purge_bunny_cache"
    id: purge_bunny_cache
    depends: [upload_to_bunny]
    run: >
      env HOME=/tmp bash -lc 'set -eu;
      if [ -z "${BUNNY_PULL_ZONE_ID}" ]; then
        echo "BUNNY_PULL_ZONE_ID is not set, skipping cache purge";
        exit 0;
      fi;
      echo "Purging BunnyCDN cache for pull zone ${BUNNY_PULL_ZONE_ID}...";
      HTTP_STATUS=$(docker run --rm curlimages/curl:latest
      -s -o /dev/null -w "%{http_code}"
      -X POST "https://api.bunny.net/pullzone/${BUNNY_PULL_ZONE_ID}/purgeCache"
      -H "AccessKey: ${BUNNY_ACCOUNT_API_KEY}"
      -H "Content-Type: application/json");
      echo "HTTP status: $HTTP_STATUS";
      if [ "$HTTP_STATUS" != "204" ]; then
        echo "Cache purge failed with HTTP status $HTTP_STATUS";
        exit 1;
      fi;
      echo "Cache purged successfully"'
