name: "FisgonTaskRequest"
params:
  - TARGET_CITY: ""
  - TARGET_SCRAPER: ""

env:
  - HOST_FISGON_PATH: ${HOST_FISGON_PATH}
  - HOST_DATA_STORAGE_PATH: ${HOST_DATA_STORAGE_PATH}
  - DATABASE_PATH: ${DATABASE_PATH}
  - HOST_REFINEMENT_PORTAL_PATH: ${HOST_REFINEMENT_PORTAL_PATH}
  - FISGON_SCRAPER_IMAGE: ${FISGON_SCRAPER_IMAGE}
  - DAGU_BASE_URL: ${DAGU_BASE_URL}

steps:
  - name: "tarea_1"
    command: >
      bash -lc 'docker run --rm
      --network host
      -v "$HOST_FISGON_PATH:/app"
      -v "$HOST_DATA_STORAGE_PATH:$HOST_DATA_STORAGE_PATH"
      -v "$HOST_REFINEMENT_PORTAL_PATH:$HOST_REFINEMENT_PORTAL_PATH"
      -w /app
      -e OPERATION=0
      -e DOCKER_CONFIG=/tmp/.docker
      -e HOME=/tmp
      -e HOST_DATA_STORAGE_PATH
      -e DATABASE_PATH
      -e HOST_REFINEMENT_PORTAL_PATH
      -e TARGET_CITY
      -e TARGET_SCRAPER
      -e DAG_RUN_URL="${DAGU_BASE_URL}/dags/${DAG_NAME}?dagRunId=${DAG_RUN_ID}"
      -e DAG_RUN_LOG_URL="${DAGU_BASE_URL}/dags/${DAG_NAME}/log?remoteNode=local&step=tarea_1&dagRunId=${DAG_RUN_ID}"
      "$FISGON_SCRAPER_IMAGE";
      rc=$?;
      exit $rc'



