name: "FisgonTaskRunner"
params:
  - TARGET_CITY: "Almeria"
    TARGET_SCRAPER: "KuverProducciones,ClassicJazz"
env:
  TARGET_CITY: ${TARGET_CITY}
  TARGET_SCRAPER: ${TARGET_SCRAPER}
  DAGU_BASE_URL: ${DAGU_BASE_URL}
steps:
  - name: "launch_children"
    command: >
      env HOME=/tmp bash -lc 'IFS="," read -ra SCRAPERS <<< "$TARGET_SCRAPER";
      for s in "${SCRAPERS[@]}"; do
      s="$(echo "$s" | xargs)";
      [ -z "$s" ] && continue;
      echo "Launching scraper: $s";
      /usr/local/bin/dagu start /var/lib/dagu/dags/FisgonTask.yml -- \
      TARGET_CITY="$TARGET_CITY" TARGET_SCRAPER="$s" DAGU_BASE_URL="$DAGU_BASE_URL" || true;
      done'
