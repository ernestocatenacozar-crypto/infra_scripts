name: "FisgonGetScrapers"
params:
  - TARGET_CITY: ""
  - GET_SCRAPERS: "Request"

steps:
  - name: "get_scrapers"
    command: >
      bash -lc 'docker run --rm
      --network host
      -v /home/ubuntu/work/fisgon:/app
      -v /home/ubuntu/data_storage:/home/ubuntu/data_storage
      -w /app
      -e OPERATION=1
      -e DOCKER_CONFIG=/tmp/.docker
      -e HOME=/tmp
      -e TARGET_CITY
      -e GET_SCRAPERS
      -e DAG_RUN_URL="${DAGU_BASE_URL}/dags/${DAG_NAME}?dagRunId=${DAG_RUN_ID}"
      -e DAG_RUN_LOG_URL="${DAGU_BASE_URL}/dags/${DAG_NAME}/log?remoteNode=local&step=get_scrapers&dagRunId=${DAG_RUN_ID}"
      fisgon_scraper:1.0;
      rc=$?;
      exit $rc'
