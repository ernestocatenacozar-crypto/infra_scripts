
name: "FixTaskSelenium"
params:
  - CIUDAD: ""
  - SCRAPER: ""

env:
  CIUDAD: ${CIUDAD}
  SCRAPER: ${SCRAPER}

steps:
  - name: "crear_sesion"
    command: >
      env HOME=/tmp bash -lc '/usr/local/bin/dagu start /var/lib/dagu/dags/FisgonSession.yml -- CIUDAD="$CIUDAD" CREATE_SESSION="1" CLOSE_SESSION=""'

  - name: "lanzar_scraper_selenium"
    command: >
      bash -lc 'set -eo pipefail;
      export DOCKER_CONFIG=/tmp/.docker HOME=/tmp;
      SELENIUM_NAME="selenium_${DAG_RUN_ID:-$$}_$(date +%s)";
      cleanup() { docker rm -f "$SELENIUM_NAME" >/dev/null 2>&1 || true; };
      trap cleanup EXIT;
      docker run -d --rm --name "$SELENIUM_NAME"
      --shm-size=2g
      -e SE_NODE_MAX_SESSIONS=1
      -e SE_NODE_OVERRIDE_MAX_SESSIONS=true
      selenium/standalone-chrome:latest >/dev/null;
      docker exec "$SELENIUM_NAME" bash -c "for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/4444) >/dev/null 2>&1 && exit 0; sleep 1; done; exit 1";
      docker run --rm
      --network container:"$SELENIUM_NAME"
      -v /home/ubuntu/work/fisgon:/app
      -v /home/ubuntu/data_storage:/home/ubuntu/data_storage
      -v /home/ubuntu/work/event_flask_app/static/img:/home/ubuntu/work/event_flask_app/static/img
      -w /app
      -e OPERATION=0
      -e DOCKER_CONFIG=/tmp/.docker
      -e HOME=/tmp
      -e TARGET_CITY="$CIUDAD"
      -e TARGET_SCRAPER="$SCRAPER"
      -e DAG_RUN_URL="${DAGU_BASE_URL}/dags/${DAG_NAME}?dagRunId=${DAG_RUN_ID}"
      -e DAG_RUN_LOG_URL="${DAGU_BASE_URL}/dags/${DAG_NAME}/log?remoteNode=local&step=lanzar_scraper_selenium&dagRunId=${DAG_RUN_ID}"
      fisgon_scraper:1.0'

  - name: "cerrar_scraper"
    command: >
      env HOME=/tmp bash -lc '/usr/local/bin/dagu start /var/lib/dagu/dags/FisgonSession.yml -- CIUDAD="$CIUDAD" CLOSE_SESSION="1"'
    continueOn:
      failure: true
