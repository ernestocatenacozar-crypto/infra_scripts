name: "FisgonMultiTask"
env:
  TARGET_CITY: ${TARGET_CITY}
  TARGET_SCRAPER: ${TARGET_SCRAPER}

steps:
  - name: "tarea_1"
    command: >
      docker run --rm
      --network host
      -v /home/ubuntu/work/fisgon:/app
      -v /home/ubuntu/data_storage:/home/ubuntu/data_storage
      -w /app
      -e OPERATION=0
      -e TARGET_CITY
      -e TARGET_SCRAPER
      -e DAG_RUN_URL="${DAGU_BASE_URL}/dags/${DAG_NAME}?dagRunId=${DAG_RUN_ID}"
      fisgon_scraper:1.0

  - name: "tarea_2"
    command: "python3 /app/script.py --param valor2"
    depends: ["tarea_1"] # Solo si quieres que vayan en orden


