env:
  BUNNY_PULL_ZONE_ID: ${BUNNY_PULL_ZONE_ID}
  BUNNY_ACCOUNT_API_KEY: ${BUNNY_ACCOUNT_API_KEY}

steps:
  - name: "purge_bunny_cache"
    id: purge_bunny_cache
    run: >
      env HOME=/tmp bash -lc 'set -eu;
      if [ -z "${BUNNY_PULL_ZONE_ID}" ]; then
        echo "BUNNY_PULL_ZONE_ID is not set, skipping cache purge";
        exit 0;
      fi;
      echo "Purging BunnyCDN cache for pull zone ${BUNNY_PULL_ZONE_ID}...";
      HTTP_STATUS=$(docker run --rm curlimages/curl:latest
      -s -o /dev/null -w "%{http_code}"
      -X POST "https://api.bunny.net/pullzone/${BUNNY_PULL_ZONE_ID}/purgeCache"
      -H "AccessKey: ${BUNNY_ACCOUNT_API_KEY}"
      -H "Content-Type: application/json");
      echo "HTTP status: $HTTP_STATUS";
      if [ "$HTTP_STATUS" != "204" ]; then
        echo "Cache purge failed with HTTP status $HTTP_STATUS";
        exit 1;
      fi;
      echo "Cache purged successfully"'
