type: graph

env:
  TARGET_CITY: "Almeria"
  HOST_FISGON_PATH: ${HOST_FISGON_PATH}
  HOST_DATA_STORAGE_PATH: ${HOST_DATA_STORAGE_PATH}
  DATABASE_PATH: ${DATABASE_PATH}
  HOST_REFINEMENT_PORTAL_PATH: ${HOST_REFINEMENT_PORTAL_PATH}
  FISGON_SCRAPER_IMAGE: ${FISGON_SCRAPER_IMAGE}

steps:

  - name: "open_session"
    id: open_session
    run: >
      env HOME=/tmp bash -lc '/usr/local/bin/dagu start /var/lib/dagu/dags/FisgonSession.yml -- \
      TARGET_CITY="$TARGET_CITY" CREATE_SESSION="1" CLOSE_SESSION="0"'
      
  - name: "get_scrapers_request"
    id: get_scrapers_request
    depends: [open_session]
    run: >
      env HOME=/tmp bash -lc '/usr/local/bin/dagu start /var/lib/dagu/dags/FisgonGetScrapers.yml -- \
      TARGET_CITY="$TARGET_CITY" GET_SCRAPERS="Request"'

  - name: "get_scrapers_selenium"
    id: get_scrapers_selenium
    depends: [get_scrapers_request]
    run: >
      env HOME=/tmp bash -lc '/usr/local/bin/dagu start /var/lib/dagu/dags/FisgonGetScrapers.yml -- \
      TARGET_CITY="$TARGET_CITY" GET_SCRAPERS="Selenium"'

  - name: "launch_children_request"
    id: launch_children_request
    depends: [get_scrapers_selenium]
    run: >
      env HOME=/tmp bash -lc 'SCRAPERS_REQUEST_FILE="/tmp/fisgon_scrapers_request.txt";
      SCRAPERS_REQUEST="";
      if [ -s "$SCRAPERS_REQUEST_FILE" ]; then
      SCRAPERS_REQUEST="$(cat "$SCRAPERS_REQUEST_FILE")";
      fi;
      IFS="," read -ra SCRAPERS <<< "$SCRAPERS_REQUEST";
      for s in "${SCRAPERS[@]}"; do
      s="$(echo "$s" | xargs)";
      [ -z "$s" ] && continue;
      echo "Launching scraper: $s";
      /usr/local/bin/dagu start /var/lib/dagu/dags/FisgonTaskRequest.yml -- \
      TARGET_CITY="$TARGET_CITY" TARGET_SCRAPER="$s" || true;
      done'
    continue_on:
      failure: true

  - name: "launch_children_selenium"
    id: launch_children_selenium
    depends: [launch_children_request]
    run: >
      env HOME=/tmp bash -lc 'SCRAPERS_SELENIUM_FILE="/tmp/fisgon_scrapers_selenium.txt";
      SCRAPERS_SELENIUM="";
      if [ -s "$SCRAPERS_SELENIUM_FILE" ]; then
      SCRAPERS_SELENIUM="$(cat "$SCRAPERS_SELENIUM_FILE")";
      fi;
      IFS="," read -ra SCRAPERS <<< "$SCRAPERS_SELENIUM";
      for s in "${SCRAPERS[@]}"; do
      s="$(echo "$s" | xargs)";
      [ -z "$s" ] && continue;
      echo "Launching scraper: $s";
      /usr/local/bin/dagu start /var/lib/dagu/dags/FisgonTaskSelenium.yml -- \
      TARGET_CITY="$TARGET_CITY" TARGET_SCRAPER="$s" || true;
      done'
    continue_on:
      failure: true

  - name: "close_session"
    id: close_session
    depends: [launch_children_selenium]
    run: >
      env HOME=/tmp bash -lc '/usr/local/bin/dagu start /var/lib/dagu/dags/FisgonSession.yml -- \
      TARGET_CITY="$TARGET_CITY" CREATE_SESSION="0" CLOSE_SESSION="1"'
