services:
  selenium:
    image: selenium/standalone-chrome:latest
    container_name: selenium
    restart: unless-stopped
    ports:
      - "4444:4444"
      - "7900:7900"
    shm_size: 2g
    environment:
      - SE_NODE_MAX_SESSIONS=1
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true

  cronicle:
    build: ./cronicle
    container_name: cronicle
    restart: unless-stopped
    ports:
      - "3012:3012"
    volumes:
      - ./cronicle/data:/opt/cronicle/data
      - ./cronicle/conf/config.json:/opt/cronicle/conf/config.json
      - ./cronicle/conf/setup.json:/opt/cronicle/conf/setup.json
      - /var/run/docker.sock:/var/run/docker.sock

  fisgon_api:
    build:
      context: /home/ubuntu/work/event_flask_app
      dockerfile: Dockerfile
    container_name: fisgon_api
    restart: unless-stopped
    environment:
      TZ: Europe/Madrid
    ports:
      - "5002:5002"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5002/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      - /home/ubuntu/data_storage:/app/data