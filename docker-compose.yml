name: ${COMPOSE_PROJECT_NAME}

services:
  selenium:
    image: selenium/standalone-chrome:latest
    restart: unless-stopped
    profiles:
      - selenium
    ports:
      - "${SELENIUM_PORT}:4444"
      - "${SELENIUM_VNC_PORT}:7900"
    shm_size: 2g
    environment:
      SE_NODE_MAX_SESSIONS: 1
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"

  dagu:
    image: ${DAGU_IMAGE}
    restart: unless-stopped
    ports:
      - "${DAGU_HOST_PORT}:6806"
    volumes:
      - ./dagu/base.yaml:/var/lib/dagu/base.yaml
      - ./dagu/dags:/var/lib/dagu/dags
      - ./dagu/configs:/var/lib/dagu/configs
      - ./dagu/data:/var/lib/dagu/data
      - ./dagu/logs:/var/lib/dagu/logs
      - ./dagu/suspend:/var/lib/dagu/suspend
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_FISGON_PATH}:/deps/fisgon
      - ${HOST_FRONTEND_DIST_PATH}:/dist
    environment:
      DAGU_HOST: 0.0.0.0
      DAGU_PORT: 6806
      DAGU_AUTH_MODE: none
      TZ: ${TZ}
      BUNNY_STORAGE_API_KEY: ${BUNNY_STORAGE_API_KEY}
      BUNNY_STORAGE_ZONE: ${BUNNY_STORAGE_ZONE}
      BUNNY_PULL_ZONE_ID: ${BUNNY_PULL_ZONE_ID}
      BUNNY_ACCOUNT_API_KEY: ${BUNNY_ACCOUNT_API_KEY}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BASE_URL: ${BASE_URL}
      DAGU_BASE_URL: ${DAGU_BASE_URL}
      HOST_FISGON_PATH: ${HOST_FISGON_PATH}
      FISGON_SCRAPER_IMAGE: ${FISGON_SCRAPER_IMAGE}
      HOST_DATA_STORAGE_PATH: ${HOST_DATA_STORAGE_PATH}
      DATABASE_PATH: ${DATABASE_PATH}
      HOST_REFINEMENT_PORTAL_PATH: ${HOST_REFINEMENT_PORTAL_PATH}
      HOST_FRONTEND_PATH: ${HOST_FRONTEND_PATH}
      HOST_FRONTEND_DIST_PATH: ${HOST_FRONTEND_DIST_PATH}
      HOST_SSH_PATH: ${HOST_SSH_PATH}
      FRONTEND_IMAGE: ${FRONTEND_IMAGE}
      FRONTEND_BUILD_IMAGE: ${FRONTEND_BUILD_IMAGE}
      FRONTEND_NODE_MODULES_VOLUME: ${FRONTEND_NODE_MODULES_VOLUME}

  refinement_portal:
    image: ${REFINEMENT_PORTAL_IMAGE}
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      HOST_FISGON_PATH: ${HOST_FISGON_PATH}
      HOST_DATA_STORAGE_PATH: ${HOST_DATA_STORAGE_PATH}
      DATABASE_PATH: ${DATABASE_PATH}
    ports:
      - "${REFINEMENT_PORTAL_PORT}:5002"
    volumes:
      - ${HOST_REFINEMENT_PORTAL_PATH}:/app
      - ${HOST_FISGON_PATH}:${HOST_FISGON_PATH}
      - ${HOST_DATA_STORAGE_PATH}:${HOST_DATA_STORAGE_PATH}
    command: ["python", "app.py"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5002/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    environment:
      ORBITA_CITY: ${ORBITA_CITY}
      HOST_FRONTEND_PATH: ${HOST_FRONTEND_PATH}
      HOST_DATA_STORAGE_PATH: ${HOST_DATA_STORAGE_PATH}
      CHOKIDAR_USEPOLLING: "1"
      PORT: "5000"
    ports:
      - "${FRONTEND_PORT}:5000"
    volumes:
      - ${HOST_FRONTEND_PATH}:${CONTAINER_APP_ROOT_FRONTEND}
      - ${HOST_FRONTEND_PATH}:${HOST_FRONTEND_PATH}
      - frontend_node_modules:${CONTAINER_FRONTEND_NODE_MODULES_PATH}
      - ${HOST_FRONTEND_DIST_PATH}:${CONTAINER_APP_ROOT_BUILD}
      - ${HOST_DATA_STORAGE_PATH}:${HOST_DATA_STORAGE_PATH}

  frontend_build:
    image: ${FRONTEND_BUILD_IMAGE}
    profiles:
      - build
    restart: "no"
    environment:
      ORBITA_CITY: ${ORBITA_CITY}
      HOST_FRONTEND_PATH: ${HOST_FRONTEND_PATH}
      HOST_DATA_STORAGE_PATH: ${HOST_DATA_STORAGE_PATH}
    volumes:
      - ${HOST_FRONTEND_PATH}:${CONTAINER_APP_ROOT_FRONTEND}
      - ${HOST_FRONTEND_PATH}:${HOST_FRONTEND_PATH}
      - frontend_node_modules:${CONTAINER_FRONTEND_NODE_MODULES_PATH}
      - ${HOST_FRONTEND_DIST_PATH}:${CONTAINER_APP_ROOT_BUILD}
      - ${HOST_DATA_STORAGE_PATH}:${HOST_DATA_STORAGE_PATH}

volumes:
  frontend_node_modules:
    name: ${FRONTEND_NODE_MODULES_VOLUME}
